<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="dash.meta.title">Admin Panel – Aurora Nails Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dashboard-page">

  <!-- Login screen -->
  <div class="container login-screen" id="loginScreen">
    <div class="login-lang">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="az" aria-pressed="true">AZ</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="hero-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2c1.8 2.6 5 5.7 5 9.2A5 5 0 0 1 7 11.2C7 7.7 10.2 4.6 12 2z" fill="currentColor"/>
        <circle cx="18.5" cy="5.5" r="1.4" fill="currentColor"/>
        <circle cx="5" cy="16" r="1" fill="currentColor"/>
      </svg>
    </div>
    <h1 data-i18n="dash.title">Admin Panel</h1>
    <p data-i18n="dash.loginSub">Rezervasiyaları idarə etmək üçün admin kodunu daxil edin.</p>
    <div id="loginError" class="login-error"></div>
    <div class="input-wrapper">
      <input type="password" id="adminCodeInput" class="form-input" placeholder="Admin kodu" data-i18n-placeholder="dash.code.ph" autocomplete="off" aria-label="Admin kodu" data-i18n-aria="dash.code.ph">
      <button id="adminToggle" class="toggle-password" type="button" aria-label="Şifrəni göstər" data-i18n-aria="dash.showPass" aria-pressed="false">
        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
    <button id="loginBtn" class="btn btn-primary login-submit" data-i18n="dash.login">Daxil ol</button>
  </div>

  <!-- Dashboard -->
  <div class="container dashboard-shell" id="dashboardScreen" hidden>
    <div class="dashboard-topbar">
      <div class="dashboard-brand">
        <div class="hero-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2c1.8 2.6 5 5.7 5 9.2A5 5 0 0 1 7 11.2C7 7.7 10.2 4.6 12 2z" fill="currentColor"/>
            <circle cx="18.5" cy="5.5" r="1.4" fill="currentColor"/>
            <circle cx="5" cy="16" r="1" fill="currentColor"/>
          </svg>
        </div>
        <h1 data-i18n="dash.title">Admin Panel</h1>
      </div>
      <div class="dashboard-topbar-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="az" aria-pressed="true">AZ</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button id="logoutBtn" class="logout-btn" data-i18n="dash.logout">Çıxış</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="statBooked">0</span>
        <span class="stat-label" data-i18n="dash.stat.booked">Rezerv olunub</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statFree">0</span>
        <span class="stat-label" data-i18n="dash.stat.free">Boş saat</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label" data-i18n="dash.stat.total">Cəmi saat</span>
      </div>
    </div>

    <label for="date" data-i18n="booking.dateLabel">Gün seçin:</label>
    <input type="date" id="date">

    <div id="slots" class="admin-slots-list"></div>

    <div class="dashboard-controls">
      <button id="dayOffBtn" class="admin-action-btn" data-i18n="dash.dayOff">Bugün işləmirik</button>
      <button id="cleanupBtn" class="admin-action-btn secondary" data-i18n="dash.cleanup">Köhnə qeydləri təmizlə</button>
    </div>
  </div>

  <!-- Name/Phone Modal (used for admin add/edit) -->
  <div id="nameModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2 id="modalTitle">Rezervasiya</h2>
      <input type="text" id="modalNameInput" placeholder="Müştərinin adı..." data-i18n-placeholder="dash.modal.name.ph" autocomplete="off">
      <input type="tel" id="modalPhoneInput" placeholder="Telefon nömrəsi..." data-i18n-placeholder="dash.modal.phone.ph" autocomplete="off" style="margin-top:8px">
      <div class="modal-actions">
        <button id="modalConfirm" class="primary" data-i18n="modal.confirm">Təsdiqlə</button>
        <button id="modalCancel" class="ghost" data-i18n="modal.cancel">Ləğv et</button>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2 id="confirmTitle" data-i18n="confirm.title">Təsdiq</h2>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="ghost" data-i18n="confirm.back">Geri</button>
        <button id="confirmOk" class="primary" data-i18n="confirm.ok">Təsdiq</button>
      </div>
    </div>
  </div>

  <!-- Back to top -->
  <button id="backToTop" class="back-to-top" aria-label="Yuxarı qayıt" data-i18n-aria="common.backToTop">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0l-6 6m6-6l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script src="/i18n.js"></script>
  <script>
    const HOURS = [
      "10:00", "11:00", "12:00",
      "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00"
    ];

    const API_BASE = window.location.origin;
    const API_URL = `${API_BASE}/api/reservations`;
    const TOKEN_KEY = 'an_admin_token';

    let adminToken = sessionStorage.getItem(TOKEN_KEY) || '';
    let selectedHour = null;
    let selectedDate = null;
    let isEditing = false;
    let pollingInterval = null;

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginError = document.getElementById('loginError');
    const adminCodeInput = document.getElementById('adminCodeInput');
    const loginBtn = document.getElementById('loginBtn');
    const adminToggle = document.getElementById('adminToggle');
    const logoutBtn = document.getElementById('logoutBtn');
    const dateInput = document.getElementById('date');
    const slotContainer = document.getElementById('slots');
    const dayOffBtn = document.getElementById('dayOffBtn');
    const cleanupBtn = document.getElementById('cleanupBtn');

    // Headers every admin request carries (auth + the visitor's language so the
    // server's error messages match the UI).
    function authHeaders(extra = {}) {
      return { 'x-admin-token': adminToken, 'x-lang': getLang(), ...extra };
    }

    // Login errors are tagged with data-i18n so they re-translate on language switch.
    function setLoginError(key) {
      loginError.setAttribute('data-i18n', key);
      loginError.textContent = t(key);
      loginError.classList.add('show');
    }

    function clearLoginError() {
      loginError.removeAttribute('data-i18n');
      loginError.classList.remove('show');
    }

    function showLogin(errorKey) {
      adminToken = '';
      sessionStorage.removeItem(TOKEN_KEY);
      loginScreen.hidden = false;
      dashboardScreen.hidden = true;
      stopPolling();
      if (errorKey) setLoginError(errorKey);
    }

    function showDashboard() {
      loginScreen.hidden = true;
      dashboardScreen.hidden = false;
      clearLoginError();
      if (!dateInput.value) {
        const today = new Date();
        dateInput.value = formatDate(today);
      }
      loadSlots();
      startPolling();
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function verifyToken(token) {
      const resp = await fetch(`${API_BASE}/api/admin/verify`, {
        method: 'POST',
        headers: { 'x-admin-token': token, 'x-lang': getLang() }
      });
      return resp.ok;
    }

    async function attemptLogin() {
      const token = adminCodeInput.value.trim();
      if (!token) {
        setLoginError('dash.err.enterCode');
        return;
      }
      loginBtn.disabled = true;
      try {
        const ok = await verifyToken(token);
        if (ok) {
          adminToken = token;
          sessionStorage.setItem(TOKEN_KEY, token);
          adminCodeInput.value = '';
          showDashboard();
        } else {
          setLoginError('dash.err.wrongCode');
        }
      } catch (e) {
        setLoginError('dash.err.server');
      } finally {
        loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener('click', attemptLogin);
    adminCodeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptLogin();
    });
    adminToggle.addEventListener('click', () => {
      const showing = adminCodeInput.type === 'text';
      adminCodeInput.type = showing ? 'password' : 'text';
      adminToggle.setAttribute('aria-pressed', String(!showing));
    });
    logoutBtn.addEventListener('click', () => showLogin());

    async function fetchBookings(date) {
      const resp = await fetch(`${API_URL}?date=${encodeURIComponent(date)}`, {
        headers: authHeaders()
      });
      if (resp.status === 401) {
        showLogin('dash.err.session');
        return {};
      }
      return resp.json();
    }

    function updateStats(dayBookings) {
      const bookedCount = HOURS.filter(h => !!dayBookings[h]).length;
      document.getElementById('statBooked').textContent = bookedCount;
      document.getElementById('statFree').textContent = HOURS.length - bookedCount;
      document.getElementById('statTotal').textContent = HOURS.length;
    }

    // The API returns "Name (phone)" to admins. Split it so the day-off marker can be
    // shown in the active language and empty phone numbers don't leave a stray "()".
    function splitBookingLabel(raw) {
      const match = raw.match(/^(.*) \((.*)\)$/);
      return match ? { name: match[1], phone: match[2] } : { name: raw, phone: '' };
    }

    function formatBookingLabel(raw) {
      const { name, phone } = splitBookingLabel(raw);
      const shown = displayName(name);
      return phone ? `${shown} (${phone})` : shown;
    }

    // Overlapping loads (date change, language switch, polling) can resolve out of
    // order; only the most recent one is allowed to render.
    let loadSeq = 0;

    async function loadSlots() {
      const date = dateInput.value;
      if (!date) return;

      const seq = ++loadSeq;
      slotContainer.innerHTML = '';
      const data = await fetchBookings(date);
      if (seq !== loadSeq) return;
      const bookings = data.bookings || data || {};
      const dayBookings = bookings[date] || {};

      updateStats(dayBookings);

      HOURS.forEach(hour => {
        const div = document.createElement('div');
        const isBooked = !!dayBookings[hour];
        div.className = 'admin-slot ' + (isBooked ? 'is-booked' : 'is-free');

        // Built with textContent: customer-supplied names must never be parsed as HTML.
        const info = document.createElement('div');
        info.className = 'admin-slot-info';
        const hourEl = document.createElement('span');
        hourEl.className = 'admin-slot-hour';
        hourEl.textContent = hour;
        const nameEl = document.createElement('span');
        nameEl.className = 'admin-slot-name';
        nameEl.textContent = isBooked ? formatBookingLabel(dayBookings[hour]) : t('dash.free');
        info.append(hourEl, nameEl);
        div.appendChild(info);

        const actions = document.createElement('div');
        actions.className = 'admin-slot-actions';

        const editBtn = document.createElement('button');
        editBtn.textContent = t(isBooked ? 'dash.edit' : 'dash.add');
        editBtn.className = 'admin-slot-btn edit';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          isEditing = isBooked;
          openNameModal(hour, date, isBooked ? dayBookings[hour] : null);
        });
        actions.appendChild(editBtn);

        if (isBooked) {
          const cancelBtn = document.createElement('button');
          cancelBtn.textContent = t('dash.delete');
          cancelBtn.className = 'admin-slot-btn cancel';
          cancelBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const confirmed = await showConfirm(t('dash.confirm.cancelBooking', { hour }));
            if (!confirmed) return;
            const params = new URLSearchParams({ date, hour });
            const resp = await fetch(`${API_URL}?${params.toString()}`, {
              method: 'DELETE',
              headers: authHeaders()
            });
            if (resp.ok) {
              await loadSlots();
            } else {
              const err = await resp.json().catch(() => ({}));
              alert(err.message || t('alert.error'));
            }
          });
          actions.appendChild(cancelBtn);
        }

        div.appendChild(actions);
        slotContainer.appendChild(div);
      });
    }

    function openNameModal(hour, date, existingLabel) {
      selectedHour = hour;
      selectedDate = date;
      document.getElementById('modalTitle').textContent = t(isEditing ? 'dash.modal.editTitle' : 'dash.modal.addTitle');
      const nameInput = document.getElementById('modalNameInput');
      const phoneInput = document.getElementById('modalPhoneInput');
      if (isEditing && existingLabel) {
        const { name, phone } = splitBookingLabel(existingLabel);
        nameInput.value = name;
        phoneInput.value = phone;
      } else {
        nameInput.value = '';
        phoneInput.value = '';
      }
      const modal = document.getElementById('nameModal');
      modal.style.display = 'flex';
      void modal.offsetWidth;
      modal.classList.add('show');
      setTimeout(() => nameInput.focus(), 100);
    }

    function closeNameModal() {
      const modal = document.getElementById('nameModal');
      modal.classList.remove('show');
      setTimeout(() => { modal.style.display = 'none'; }, 220);
      selectedHour = null;
      selectedDate = null;
      isEditing = false;
    }

    document.getElementById('modalCancel').onclick = closeNameModal;

    document.getElementById('modalConfirm').onclick = async function() {
      const name = document.getElementById('modalNameInput').value.trim();
      const phone = document.getElementById('modalPhoneInput').value.trim();
      if (!name || !phone) {
        alert(t('dash.alert.nameAndPhone'));
        return;
      }

      let result;
      if (isEditing) {
        result = await fetch(API_URL, {
          method: 'PUT',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ date: selectedDate, hour: selectedHour, newName: name, newPhone: phone })
        }).then(r => r.json());
      } else {
        result = await fetch(API_URL, {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ date: selectedDate, hour: selectedHour, name, phone })
        }).then(r => r.json());
      }

      if (result.status === 'success') {
        closeNameModal();
        await loadSlots();
      } else {
        alert(result.message || t('alert.error'));
      }
    };

    async function showConfirm(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirmModal');
        const messageEl = document.getElementById('confirmMessage');
        const confirmBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');

        messageEl.textContent = message;
        modal.style.display = 'flex';
        void modal.offsetWidth;
        modal.classList.add('show');

        const cleanup = () => {
          modal.classList.remove('show');
          setTimeout(() => { modal.style.display = 'none'; }, 300);
          confirmBtn.removeEventListener('click', onConfirm);
          cancelBtn.removeEventListener('click', onCancel);
        };
        const onConfirm = () => { cleanup(); resolve(true); };
        const onCancel = () => { cleanup(); resolve(false); };

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    dayOffBtn.addEventListener('click', async () => {
      const date = dateInput.value;
      if (!date) return;
      const confirmed = await showConfirm(t('dash.confirm.dayOff', { date }));
      if (!confirmed) return;

      const resp = await fetch(`${API_BASE}/api/reservations/day-off`, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ date })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || data.status !== 'success') {
        alert(data.message || t('dash.err.dayOff'));
        return;
      }
      await loadSlots();
    });

    cleanupBtn.addEventListener('click', async () => {
      const confirmed = await showConfirm(t('dash.confirm.cleanup'));
      if (!confirmed) return;

      const resp = await fetch(`${API_BASE}/api/reservations/cleanup`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        alert(data.message || t('dash.err.cleanup'));
        return;
      }
      alert(t('dash.cleanupDone', { n: data.deleted || 0 }));
      await loadSlots();
    });

    dateInput.addEventListener('change', () => loadSlots());

    // Re-render language-dependent parts when the language is switched.
    document.addEventListener('langchange', () => {
      if (!dashboardScreen.hidden) loadSlots();
      const modal = document.getElementById('nameModal');
      if (modal.classList.contains('show')) {
        document.getElementById('modalTitle').textContent = t(isEditing ? 'dash.modal.editTitle' : 'dash.modal.addTitle');
      }
    });

    function startPolling() {
      stopPolling();
      pollingInterval = setInterval(() => {
        if (!document.hidden) loadSlots();
      }, 15000);
    }

    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    const backToTopBtn = document.getElementById('backToTop');
    if (backToTopBtn) {
      const toggleBackToTop = () => {
        backToTopBtn.classList.toggle('show', window.scrollY > 480);
      };
      window.addEventListener('scroll', toggleBackToTop, { passive: true });
      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    (async function init() {
      const today = new Date();
      dateInput.value = formatDate(today);

      if (adminToken) {
        const ok = await verifyToken(adminToken);
        if (ok) {
          showDashboard();
          return;
        }
      }
      showLogin();
    })();
  </script>
</body>
</html>
